{% extends "base.html" %}
{% block title %}Shopping List - Cookshelf{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Shopping List</h1>
            {% if items %}
            <button hx-post="/shopping/clear" hx-target="#shopping-items" hx-swap="innerHTML"
                    class="btn btn-outline-danger btn-sm">Clear All</button>
            {% endif %}
        </div>

        {% if recipe_title %}
        <p class="text-muted mb-3">From: <a href="/recipes/{{ recipe_id }}" class="link-secondary">{{ recipe_title }}</a></p>
        {% endif %}

        <div id="shopping-items">
            {% include "partials/shopping_list_items.html" %}
        </div>
    </div>
</div>
{% endblock %}
